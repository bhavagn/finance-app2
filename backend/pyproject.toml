[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-app-backend"
version = "0.1.0"
description = "Python logic plane: parsing, reconciliation, categorisation for finance-app2."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pdfplumber>=0.11",
    "supabase>=2.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["pipeline", "worker"]

[tool.setuptools.packages.find]
include = [
    "api*",
    "ingestion*",
    "normalize*",
    "parser*",
    "reconcile*",
    "merchant*",
    "categorize*",
    "detectors*",
    "learning*",
    "db*",
    "models*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
